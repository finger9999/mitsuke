# 미츠케 설정
# 검색어는 메루카리에서 쓰는 표기로 적는다. 검색어마다 따로 규칙을 줄 수도 있고,
# 아래 defaults는 모든 검색어에 공통으로 적용된다.

request_delay_seconds: 8   # 검색어 사이 대기 시간 (초)
page_size: 60              # 검색어당 가져올 최신 매물 수

defaults:
  price_max: 3000          # 상의·하의·소품 등 기본 예산 (엔)
  category_price_max:      # 카테고리별 예산. 위 단계를 적으면 그 아래 카테고리 전부에 적용
    12: 7000               # レディース > ジャケット/アウター
    31: 7000               # メンズ > ジャケット/アウター
  exclude_categories:
    - 186                  # レディース > ルームウェア/パジャマ > パジャマ
  exclude_keywords:
    - パジャマ             # 카테고리를 다르게 올린 파자마도 제목으로 거름

searches:
  - keyword: ツモリチサト   # "tsumori chisato"로 검색해도 결과가 같음
  # sensounico는 일본어/영어 표기 검색 결과가 일부만 겹쳐서 둘 다 검색한다
  - keyword: センソユニコ
  - keyword: sensounico

# 카테고리 id 찾기: finder/sources/mercari_categories.json
# (python main.py update-categories 로 새로 받을 수 있음)

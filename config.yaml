# 미츠케 설정
# 검색어는 일본어로 적는다. 검색어마다 예산·사이즈·제외 키워드를 따로 줄 수 있다.

request_delay_seconds: 8   # 검색어 사이 대기 시간 (초)
page_size: 60              # 검색어당 가져올 최신 매물 수

defaults:
  price_min: 0
  exclude_keywords:        # 모든 검색어에 공통으로 적용
    - ジャンク             # 정크(고장품)
    - 破損                 # 파손
    - 部品取り             # 부품용
    - 空箱                 # 빈 상자
    - 本体なし             # 본체 없음

searches:
  # 예시. 원하는 검색어로 바꿔서 쓴다
  - keyword: ポーター タンカー
    price_max: 20000
    exclude_keywords: [キーホルダー]
  # - keyword: ニューバランス 990v6
  #   price_max: 30000
  #   sizes: ["27.5", "27.5cm"]   # 제목에 이 중 하나가 있어야 통과
